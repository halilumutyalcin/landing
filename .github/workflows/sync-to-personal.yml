name: Sync to Personal Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Mirror Push to Personal Repo
    if: github.repository == 'senguller-otomotiv/landing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to halilumutyalcin/landing
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_REPO_TOKEN }}
        run: |
          if [ -z "$PERSONAL_TOKEN" ]; then
            echo "Error: PERSONAL_REPO_TOKEN secret is not set."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add personal https://x-access-token:${PERSONAL_TOKEN}@github.com/halilumutyalcin/landing.git
          git push --force personal main
